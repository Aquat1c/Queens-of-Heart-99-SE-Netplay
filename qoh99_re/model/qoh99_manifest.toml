  { key = "editedActorTransition", original = "sub_42A440", kind = "FunctionEntry", november_va = 0x42A440, december_va = 0x42A440, shift_class = "SemanticallyEdited", runtime_use = "SeamResolved", prologue_bytes = 16, note = "One of exactly three semantically edited functions. Entry VA is unchanged and the compared entry window is byte-identical, yet December adds a transition-flag clear: the first divergent byte sits just past the window, in the first forward-branch displacement (0xFB -> 0xFE). Training resolves and qualifies this entry as the native throw-pair installation seam, calls the selected build's original body first, and must not infer semantic parity from the shared prologue." },
  { key = "editedContentGate", original = "sub_471680", kind = "FunctionEntry", november_va = 0x471680, december_va = 0x471680, shift_class = "SemanticallyEdited", runtime_use = "NotCallable", note = "Semantically edited. December gates the installation on System/WinMes/Tir_Mes1.Img carrying raw FILETIME 0x01BFA6C3DA3E1B00. The entry window is byte-identical, which is exactly why entry-window equality must never be read as semantic equality. NOTE: that is the GAME'S OWN gate and the statement stands, but we no longer mirror it as an admission precondition - a FILETIME is filesystem metadata that any copy, archive extraction or sync rewrites, so it would refuse legitimate installations for a reason the user cannot fix. The December installation on hand does satisfy it (0x01BFA6C3DA3E1B00, verified), so dropping it hides no failure. Content identity is now carried by the simulation probe below." },
